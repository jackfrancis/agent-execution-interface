# The HMAC key the control plane signs run credentials with. REPLACE before any
# real use and do NOT commit a live value — e.g.:
#   kubectl -n aei-system create secret generic aei-signing \
#     --from-literal=AEI_SIGNING_SECRET="$(openssl rand -base64 32)" \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: aei-signing
  namespace: aei-system
type: Opaque
stringData:
  AEI_SIGNING_SECRET: "replace-me-with-32-or-more-random-bytes"
