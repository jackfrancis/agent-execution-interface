# The cluster-internal endpoint, one port per caller:
#   * http (8080)     — the runtime ABI, AEI_CONTROL_URL / AEI_BROKER_URL
#                       (/complete, /redeem, /vend, /authority), and /metrics
#   * dispatch (8081) — the data plane, AEI_DISPATCH_URL (/dispatch, /runs/{id})
# Separate ports let a NetworkPolicy (networkpolicy.yaml) admit runtime pods to the
# ABI while keeping them away from dispatch.
apiVersion: v1
kind: Service
metadata:
  name: aei-controller
  namespace: aei-system
spec:
  selector:
    app.kubernetes.io/name: aei-controller
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: dispatch
      port: 8081
      targetPort: dispatch
