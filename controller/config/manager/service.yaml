# The cluster-internal endpoint that carries BOTH planes on one port:
#   * the runtime ABI  — AEI_CONTROL_URL / AEI_BROKER_URL (/complete, /redeem, /vend)
#   * the data plane   — AEI_DISPATCH_URL (/dispatch, /runs/{id})
# Reachable at http://aei-controller.aei-system.svc:8080
apiVersion: v1
kind: Service
metadata:
  name: aei-controller
  namespace: aei-system
spec:
  selector:
    app.kubernetes.io/name: aei-controller
  ports:
    - name: http
      port: 8080
      targetPort: 8080
