---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: agentproviderclasses.agents.x-k8s.io
spec:
  group: agents.x-k8s.io
  names:
    kind: AgentProviderClass
    listKind: AgentProviderClassList
    plural: agentproviderclasses
    shortNames:
    - apc
    singular: agentproviderclass
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.provider
      name: Provider
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentProviderClass binds a class name to a provider and its policy
          (cluster-scoped, mirroring StorageClass/RuntimeClass).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AgentProviderClassSpec is the admin's binding of a class name to a provider and
              its policy — the indirection that makes an AgentRun portable across clusters
              (docs/design.md). The app references the class by name; the admin owns what it
              maps to.
            properties:
              capabilities:
                description: |-
                  Capabilities are the semantics this class advertises (ASYNC, PULL_CREDENTIAL,
                  DURABLE, …), verified by conformance and matched against AgentRun requirements.
                items:
                  type: string
                type: array
              defaultIsolationClass:
                description: DefaultIsolationClass is applied when an AgentRun omits
                  an isolationClass.
                type: string
              identityIssuer:
                description: |-
                  IdentityIssuer names where per-run credentials are minted (e.g. an HMAC key
                  ref or a SPIFFE trust domain).
                type: string
              parameters:
                additionalProperties:
                  type: string
                description: |-
                  Parameters are driver-specific knobs (endpoint, image, namespace, control
                  URL, …) passed to the provider at build time.
                type: object
              provider:
                description: |-
                  Provider is the registered driver that backs this class (e.g. "k8s-job",
                  "agent-sandbox", "kagent").
                minLength: 1
                type: string
              queueName:
                description: QueueName defers admission/quota to Kueue (docs/design.md,
                  composition).
                type: string
            required:
            - provider
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
