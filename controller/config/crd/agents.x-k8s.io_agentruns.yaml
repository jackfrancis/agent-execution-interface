---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: agentruns.agents.x-k8s.io
spec:
  group: agents.x-k8s.io
  names:
    kind: AgentRun
    listKind: AgentRunList
    plural: agentruns
    shortNames:
    - ar
    singular: agentrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.handle.provider
      name: Provider
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentRun is the app's intent to run one unit of agent work (namespaced,
          mirroring PersistentVolumeClaim).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AgentRunSpec is the app's intent: run this task, as this identity, on the
              provider bound to this class (docs/design.md). The payload is opaque —
              taskRef and parameters are handles AEI never parses.
            properties:
              identity:
                description: Identity is the per-run credential to mint (delegated
                  authorization).
                properties:
                  audience:
                    type: string
                  scopes:
                    items:
                      type: string
                    type: array
                  subject:
                    type: string
                type: object
              isolationClass:
                description: IsolationClass names the required isolation; empty defaults
                  from the class.
                type: string
              parameters:
                additionalProperties:
                  type: string
                description: Parameters are per-run values that ride the dispatch
                  (rule R1).
                type: object
              providerClassName:
                description: |-
                  ProviderClassName references an AgentProviderClass by name; empty selects the
                  cluster default (the class annotated IsDefaultClassAnnotation).
                type: string
              requirements:
                description: Requirements are app-declared semantics admission enforces
                  against the class.
                properties:
                  isolation:
                    enum:
                    - required
                    - preferred
                    - none
                    type: string
                  runtimeLifecycle:
                    enum:
                    - perRun
                    - any
                    type: string
                  statePersistence:
                    enum:
                    - none
                    type: string
                type: object
              taskRef:
                description: TaskRef is an opaque handle to the work.
                type: string
              timeoutSeconds:
                description: TimeoutSeconds bounds the run's wall clock and is the
                  completion backstop.
                format: int64
                type: integer
            type: object
          status:
            description: AgentRunStatus is the observed state of a run.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              handle:
                description: HandleStatus records where a run was placed.
                properties:
                  provider:
                    type: string
                  ref:
                    type: string
                type: object
              phase:
                description: AgentRunPhase is the coarse lifecycle state.
                type: string
              resultRef:
                description: ResultRef is an opaque pointer to where the result lives;
                  AEI never parses it.
                type: string
              timing:
                description: TimingStatus is the launcher-symmetric run-timing breakdown.
                properties:
                  modelCalls:
                    type: integer
                  modelSeconds:
                    type: number
                  provisioningSeconds:
                    type: number
                  runtimeSeconds:
                    type: number
                  toolCalls:
                    type: integer
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
