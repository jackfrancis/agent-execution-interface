# agent-sandbox provider class (non-default; apps opt in by name). Requires the
# upstream agent-sandbox substrate (the Sandbox CRD + its controller, from
# kubernetes-sigs/agent-sandbox) AND the AEI-side RBAC in
# controller/config/rbac/agent-sandbox.yaml. Both the RBAC and this class are
# applied by `make agent-sandbox-enable`, which first preflights that the upstream
# substrate is installed. AEI does not install the substrate itself.
apiVersion: agents.x-k8s.io/v1alpha1
kind: AgentProviderClass
metadata:
  name: isolated
spec:
  provider: agent-sandbox
  parameters:
    # A provider parameter (this class is cluster-scoped and has no namespace of its
    # own): the admin's runtime-placement policy. "{app}-runtime" gives each app its
    # OWN runtime namespace (e.g. gofer-runtime) — created on demand with a
    # default-deny-ingress NetworkPolicy — keeping the untrusted runtime out of both
    # the control-plane namespace (aei-system) and the app's own namespace (where its
    # secrets live). App-less runs (the declarative AgentRun path) pool into
    # "aei-runtime". A plain literal instead (e.g. "aei-runtime") shares one
    # admin-provisioned namespace across all apps.
    namespace: "{app}-runtime"
    # No image: the class is a generic substrate binding; the app supplies its
    # own runtime image (on its AgentApp / AgentRun).
    controlURL: http://aei-controller.aei-system.svc:8080/aei/v1alpha1
    # The taints every run's pod tolerates, so runs can use nodes an admin has
    # reserved for them with a taint (which keeps everything else off those nodes).
    # Written the way `kubectl taint` writes taints, comma-separated:
    # "key=value:NoSchedule", "key:NoSchedule" (any value) or "key" (any effect).
    # Empty means none. `make` sets it from RUNTIME_TOLERATIONS. A change reaches
    # runs once the controller restarts: it reads a class when it first uses it.
    tolerations: ""
  # Every run of this class gets gVisor isolation: the provider puts it on the
  # sandbox pod as runtimeClassName, so the cluster MUST have a RuntimeClass named
  # "gvisor" (`make install-gvisor` installs one on kind). Without it the run fails
  # at dispatch rather than quietly falling back to the default runtime.
  defaultIsolationClass: gvisor
  # ISOLATION:<class> is the admin's claim that this class can satisfy that
  # isolation. Once any ISOLATION: entry is listed, a defaultIsolationClass outside
  # the list is rejected at admission — so the advertised and applied policy cannot
  # drift apart.
  capabilities: [ASYNC, "ISOLATION:gvisor"]
