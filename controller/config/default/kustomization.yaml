# The full AEI reference operator install: CRDs + RBAC + the manager
# Deployment/Service/Secret. Apply with:
#   kubectl apply -k controller/config/default
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../crd
  - ../rbac
  - ../manager
