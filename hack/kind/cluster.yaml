# The kind cluster config `make dev-up` builds by default (KIND_CONFIG). It carries
# the Kubernetes feature gates Agent Substrate's podcertcontroller needs, so ONE dev
# cluster runs every AEI provider (k8s-job, agent-sandbox, agent-substrate) and you
# can A/B-swap between them without recreating it. The gates are inert for providers
# that don't use them.
#
# It mirrors agent-substrate/substrate's hack/create-kind-cluster.sh (the source of
# truth). Parts of that script are handled elsewhere or omitted on purpose, because
# they are not cluster-config:
#   - Proxy ARP per node (gVisor pod-to-pod loopback) — applied by `make kind-up`
#     after creation, since it is a runtime node sysctl, not kind config.
#   - The local image registry — OMITTED. That is substrate's build/image-distribution
#     mechanism (build many images -> push to localhost:5001 -> nodes pull), not a
#     cluster requirement; AEI loads its single manager image with `kind load`, and
#     substrate's own installer sets the registry up when you deploy its images.
#   - /dev/kvm mount + micro-VM (kata) node labels — OMITTED (optional; gVisor works
#     without them). Use substrate's own script if you need micro-VM WorkerPools.
#
# Which Kubernetes versions this works on (kind v0.33.0 defaults to v1.37.0):
#   - v1.37 and later: the three gates are GA and on by default, and both APIs are
#     served at certificates.k8s.io/v1, so the featureGates and runtimeConfig below
#     are redundant. Setting a GA gate only logs "setting GA feature gate. It will be
#     removed in a future release". They stay for v1.35/v1.36 and for substrate builds
#     that still read v1beta1 (deprecated in v1.37). Remove the featureGates block when
#     Kubernetes removes these gates: naming an unknown gate makes creation fail.
#   - v1.35 and v1.36: all of it is required. The gates are beta and off by default,
#     and ClusterTrustBundle and PodCertificateRequest are served only at v1beta1.
#   - v1.34 and older: not supported. PodCertificateRequest is missing or alpha-only.
#     Set KIND_CONFIG= to build a plain cluster there.
# A v1.37+ node image needs kind v0.32.0 or later (v1.37 dropped kubeadm v1beta3).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# Three workers so runs actually spread: per-run providers (k8s-job, agent-sandbox)
# schedule across nodes, and a durable WorkerPool can hold more than one ateom worker.
# Scheduling on the control plane stays off, which keeps the AEI control plane away
# from the sandboxes it dispatches. Drop workers here if you want a lighter cluster.
nodes:
  - role: control-plane
  - role: worker
  - role: worker
  - role: worker
featureGates:
  ClusterTrustBundle: true
  ClusterTrustBundleProjection: true
  PodCertificateRequest: true
runtimeConfig:
  "certificates.k8s.io/v1beta1": "true"
